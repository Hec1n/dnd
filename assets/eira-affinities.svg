<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 960" role="img" aria-labelledby="title desc"><title id="title">Шесть ветвей Эйры</title><desc id="desc">По кругу: Аугмент, Эмис, Нексус, Сингуляр, Фордж, Шифт. Соседи связаны линией и близки в обучении. Сингуляр требует особого потенциала.</desc><rect width="1000" height="960" rx="24" fill="#10191e"/><text x="500" y="43" fill="#aebdbc" font-family="Segoe UI,Arial,sans-serif" font-size="17" text-anchor="middle" letter-spacing="4">КРУГ СКЛОННОСТЕЙ</text><polygon points="500,220 730,350 730,610 500,740 270,610 270,350" fill="#19262e" stroke="#98aeb3" stroke-width="4"/><path d="M500 480L500 220" stroke="#344750" stroke-width="1.5" stroke-dasharray="5 9"/><path d="M500 480L730 350" stroke="#344750" stroke-width="1.5" stroke-dasharray="5 9"/><path d="M500 480L730 610" stroke="#344750" stroke-width="1.5" stroke-dasharray="5 9"/><path d="M500 480L500 740" stroke="#344750" stroke-width="1.5" stroke-dasharray="5 9"/><path d="M500 480L270 610" stroke="#344750" stroke-width="1.5" stroke-dasharray="5 9"/><path d="M500 480L270 350" stroke="#344750" stroke-width="1.5" stroke-dasharray="5 9"/><circle cx="500" cy="480" r="104" fill="#10191e" stroke="#43545a" stroke-width="2"/><text x="500" y="464" fill="#f1e7cf" font-family="Georgia,serif" font-size="48" text-anchor="middle">ЭЙРА</text><text x="500" y="502" fill="#aebdbc" font-family="Segoe UI,Arial,sans-serif" font-size="17" text-anchor="middle">ОДИН ИСТОЧНИК</text><text x="500" y="529" fill="#aebdbc" font-family="Segoe UI,Arial,sans-serif" font-size="17" text-anchor="middle">ШЕСТЬ ВЕТВЕЙ</text><circle cx="500" cy="220" r="18" fill="#10191e" stroke="#e6bb70" stroke-width="4"/><circle cx="500" cy="220" r="7" fill="#e6bb70"/><g font-family="Segoe UI,Arial,sans-serif" text-anchor="middle"><text x="500" y="110" fill="#e6bb70" font-size="28" font-weight="700">АУГМЕНТ</text><text x="500" y="139" fill="#aebdbc" font-size="14" letter-spacing="3">AUGMENT</text><text x="500" y="168" fill="#e1e7e8" font-size="19">Усиление</text></g><circle cx="730" cy="350" r="18" fill="#10191e" stroke="#ed956d" stroke-width="4"/><circle cx="730" cy="350" r="7" fill="#ed956d"/><g font-family="Segoe UI,Arial,sans-serif" text-anchor="middle"><text x="840" y="265" fill="#ed956d" font-size="28" font-weight="700">ЭМИС</text><text x="840" y="294" fill="#aebdbc" font-size="14" letter-spacing="3">EMIS</text><text x="840" y="323" fill="#e1e7e8" font-size="19">Передача энергии</text></g><circle cx="730" cy="610" r="18" fill="#10191e" stroke="#7cbbe9" stroke-width="4"/><circle cx="730" cy="610" r="7" fill="#7cbbe9"/><g font-family="Segoe UI,Arial,sans-serif" text-anchor="middle"><text x="840" y="690" fill="#7cbbe9" font-size="28" font-weight="700">НЕКСУС</text><text x="840" y="719" fill="#aebdbc" font-size="14" letter-spacing="3">NEXUS</text><text x="840" y="748" fill="#e1e7e8" font-size="19">Управление</text></g><circle cx="500" cy="740" r="18" fill="#10191e" stroke="#bf9cf0" stroke-width="4"/><circle cx="500" cy="740" r="7" fill="#bf9cf0"/><g font-family="Segoe UI,Arial,sans-serif" text-anchor="middle"><text x="500" y="840" fill="#bf9cf0" font-size="28" font-weight="700">СИНГУЛЯР</text><text x="500" y="869" fill="#aebdbc" font-size="14" letter-spacing="3">SINGULAR</text><text x="500" y="898" fill="#e1e7e8" font-size="19">Уникальный дар</text></g><circle cx="270" cy="610" r="18" fill="#10191e" stroke="#7fd1ac" stroke-width="4"/><circle cx="270" cy="610" r="7" fill="#7fd1ac"/><g font-family="Segoe UI,Arial,sans-serif" text-anchor="middle"><text x="160" y="690" fill="#7fd1ac" font-size="28" font-weight="700">ФОРДЖ</text><text x="160" y="719" fill="#aebdbc" font-size="14" letter-spacing="3">FORGE</text><text x="160" y="748" fill="#e1e7e8" font-size="19">Создание форм</text></g><circle cx="270" cy="350" r="18" fill="#10191e" stroke="#e69dbd" stroke-width="4"/><circle cx="270" cy="350" r="7" fill="#e69dbd"/><g font-family="Segoe UI,Arial,sans-serif" text-anchor="middle"><text x