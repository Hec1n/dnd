<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1050" viewBox="0 0 1000 1050" role="img"><title>БОЙ 2 · ЗАЛ ТИХОГО КАМНЯ</title><desc>Сетка 8 × 8 · Н — неко · Ч — человек · С — каменный страж. Тумбы — непроходимые укрытия; рычаг включается действием рядом.. Отключить оба рычага → защитная оболочка стража исчезает.. Рэйн у регулятора за входом. Отступление через нижний край.. Первый ход страж только пробуждается и показывает будущую атаку.</desc><rect width="1000" height="1050" fill="#101b20"/><g font-family="Arial,sans-serif" fill="#ede4d1"><text x="65" y="65" font-size="34" font-weight="bold">БОЙ 2 · ЗАЛ ТИХОГО КАМНЯ</text><text x="65" y="105" font-size="19" fill="#b4c3c5">Сетка 8 × 8 · Н — неко · Ч — человек · С — каменный страж</text></g><rect x="90" y="170" width="608" height="608" fill="#293b39"/><rect x="168" y="324" width="72" height="72" rx="5" fill="#a1803d"/><text x="204" y="365" text-anchor="middle" font-family="Arial" font-size="14" fill="#fff">рычаг 1</text><rect x="548" y="324" width="72" height="72" rx="5" fill="#a1803d"/><text x="584" y="365" text-anchor="middle" font-family="Arial" font-size="14" fill="#fff">рычаг 2</text><rect x="244" y="476" width="72" height="72" rx="5" fill="#52646c"/><text x="280" y="517" text-anchor="middle" font-family="Arial" font-size="14" fill="#fff">тумба</text><rect x="472" y="476" width="72" height="72" rx="5" fill="#52646c"/><text x="508" y="517" text-anchor="middle" font-family="Arial" font-size="14" fill="#fff">тумба</text><rect x="320" y="704" width="72" height="72" rx="5" fill="#496458"/><text x="356" y="745" text-anchor="middle" font-family="Arial" font-size="14" fill="#fff">вход</text><rect x="396" y="704" width="72" height="72" rx="5" fill="#496458"/><text x="432" y="745" text-anchor="middle" font-family="Arial" font-size="14" fill="#fff">вход</text><path d="M90 170v608 M90 170h608" stroke="#66746a" stroke-opacity=".55"/><path d="M166 170v608 M90 246h608" stroke="#66746a" stroke-opacity=".55"/><path d="M242 170v608 M90 322h608" stroke="#66746a" stroke-opacity=".55"/><path d="M318 170v608 M90 398h608" stroke="#66746a" stroke-opacity=".55"/><path d="M394 170v608 M90 474h608" stroke="#66746a" stroke-opacity=".55"/><path d="M470 170v608 M90 550h608" stroke="#66746a" stroke-opacity=".55"/><path d="M546 170v608 M90 626h608" stroke="#66746a" stroke-opacity=".55"/><path d="M622 170v608 M90 702h608" stroke="#66746a" stroke-opacity=".55"/><path d="M698 170v608 M90 778h608" stroke="#66746a" stroke-opacity=".55"/><g font-family="Arial" font-size="17" fill="#b4c3c5"><text x="128" y="153" text-anchor="middle">A</text><text x="68" y="214" text-anchor="middle">1</text></g><g font-family="Arial" font-size="17" fill="#b4c3c5"><text x="204" y="153" text-anchor="middle">B</text><text x="68" y="290" text-anchor="middle">2</text></g><g font-family="Arial" font-size="17" fill="#b4c3c5"><text x="280" y="153" text-anchor="middle">C</text><text x="68" y="366" text-anchor="middle">3</text></g><g font-family="Arial" font-size="17" fill="#b4c3c5"><text x="356" y="153" text-anchor="middle">D</text><text x="68" y="442" text-anchor="middle">4</text></g><g font-family="Arial" font-size="17" fill="#b4c3c5"><text x="432" y="153" text-anchor="middle">E</text><text x="68" y="518" text-anchor="middle">5</text></g><g font-family="Arial" font-size="17" fill="#b4c3c5"><text x="508" y="153" text-anchor="middle">F</text><text x="68" y="594" text-anchor="middle">6</text></g><g font-family="Arial" font-size="17" fill="#b4c3c5"><text x="584" y="153" text-anchor="middle">G</text><text x="68" y="670" text-anchor="middle">7</text></g><g font-family="Arial" font-size="17" fill="#b4c3c5"><text x="660" y="153" text-anchor="middle">H</text><text x="68" y="746" text-anchor="middle">8</text></g><circle cx="356" cy="664" r="25" fill="#3e8984" stroke="#f5e7c6" stroke-width="2"/><text x="356" y="670" text-anchor="middle" font-family="Arial" font-size="17" font-weight="bold" fill="#fff">Н</text><circle cx="432" cy="664" r="25" fill="#3e8984" stroke="#f5e7c6" stroke-width="2"/><text x="432" y="670" text-anchor="middle" font-family="Arial" font-size="17" font-weight="bold" fill="#fff">Ч</text><circle cx="356" cy="360" r="25" fill="#ac5750" stroke="#f5e7c6" stroke-width="2"/><text x="356" y="366" text-anchor="middle" font-family="Arial" font-size="17" font-weight="bold" fill="#fff">С</text><g font-family="Arial" font-size="18" fill="#ede4d1"><text x="65" y="828">Тумбы — непроходимые укрытия; рычаг включается действием рядом.</text><text x="65" y="857">Отключить оба рычага → защитная оболочка стража исчезает.</text><text x="65" y="886">Рэйн у регулятора за входом. Отступление через нижний край.</text><text x="65" y="915">Первый ход страж только пробуждается и показывает будущую атаку.</text></g></svg>